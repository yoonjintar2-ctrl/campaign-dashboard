<!-- 클라우드(선택) — 웹에 올렸을 때만 로드한다. 파일로 직접 열면 데모(더미) 모드로만 동작. -->
<script>
(function(){
  if(location.protocol==='file:'){window.__offline=1;return;}
  var add=function(src,flag){var s=document.createElement('script');s.src=src;
    s.onerror=function(){window[flag]=1;};document.head.appendChild(s);};
  add('./config.js','__noConfig');
  add('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','__noSupabase');
  /* 엑셀(.xlsx) 읽기용 — 없으면 CSV 로만 불러온다 */
  add('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','__noXlsx');
})();
</script>
<style>

  /* v8 — 채도를 더 낮춘 짙은 남색 톤 */
  --plane:#eef1f5; --plane2:#f7f9fb; --surface:#fff;
  --ink:#1e2a38; --ink2:#5a6878; --muted:#8b98a7; --sec:#4e5c6d;
  --line:#e4e8ee; --line2:#eff2f6; --gline:#c5ccd6;      /* 모든 구분선 단일 색 */
  --cell:#e2e7ed;                                        /* 표 셀 테두리 (밝은 행) */
  --cell-d:rgba(255,255,255,.22);                        /* 표 셀 테두리 (헤더·TOTAL 등 어두운 행) */

  --hdr-sub:#7d8a98; --hdr-sub2:#8f9ba8;             /* 하위 세그먼트 헤더 (합계보다 연하게) */
  --gray:#9aa4b0;
  --pace:#b06a63; --pace-lt:#d9aca7;                     /* 목표 페이스 — 붉은 계열 */
  --hol:#b8665f;                                         /* 휴일 텍스트 */
  --b1:#aab4bf; --b2:#8897a6; --b3:#677b8d; --b4:#495e72; --b5:#354758;
  --neg:#c98484;

  --shadow:0 1px 2px rgba(31,44,61,.04), 0 4px 16px rgba(31,44,61,.05);
  --shadow2:0 10px 38px rgba(31,44,61,.15);
  --bg1:126,155,186; --bg2:112,143,177; --bg3:160,184,210;   /* 배경 그라데이션 */

/* 다크 톤에서는 흰 카드 위 전제로 짠 몇 곳을 눌러 준다 */
[data-theme="dark"] .card,[data-theme="dark"] .gatecard{background:var(--surface)}
[data-theme="dark"] table.tbl tbody td{background:var(--surface)}
[data-theme="dark"] body::before{opacity:.55}
[data-theme="dark"] .notice{background:#232a31;border-color:#333c45;color:var(--ink2)}
[data-theme="dark"] .demobar,[data-theme="dark"] .gate{background:rgba(20,24,28,.82)}
[data-theme="dark"] .demobar{border-color:#3a3327;background:#2a2419;color:#e2d6bd}
[data-theme="dark"] .demobar .btn{background:#3a3327;color:#e2d6bd;border-color:#4a4133}
[data-theme="dark"] .demobar .btn:hover{background:#463d2e}
[data-theme="dark"] .topbar,[data-theme="dark"] .tabs{background:var(--surface)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{
  background:var(--plane2);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .btn{background:var(--surface);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .btn:hover{background:var(--acc-soft)}
[data-theme="dark"] .btn.primary{background:var(--acc);color:#18202a;border-color:var(--acc)}
[data-theme="dark"] .pill{background:var(--surface);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .modal,[data-theme="dark"] .memenu,[data-theme="dark"] .tip{background:var(--surface);color:var(--ink)}
[data-theme="dark"] .cr,[data-theme="dark"] .stat,[data-theme="dark"] .donut{background:var(--surface)}
[data-theme="dark"] .tmap{background:var(--plane2);border-color:var(--line)}
[data-theme="dark"] .tmap .sect{border-color:var(--surface)}
[data-theme="dark"] .tmap .grp{border-color:rgba(34,39,43,.92)}
[data-theme="dark"] .tmap .tile{border-color:rgba(34,39,43,.55)}
[data-theme="dark"] table.tbl tbody td{border-color:var(--cell)}
[data-theme="dark"] .cmt{background:var(--surface);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  font-family:'Pretendard','Apple SD Gothic Neo',system-ui,-apple-system,"Segoe UI",sans-serif}
/* 배경 — 푸른 계열 그라데이션이 흐른다.
   진한 층과 옅은 층의 명도 차를 벌리고 이동 폭을 키워 움직임이 눈에 보이게 한다 */
body::before{content:'';position:fixed;inset:-40%;z-index:-1;pointer-events:none;opacity:.78;
  background:
    radial-gradient(40% 44% at 12% 18%, rgba(var(--bg1),.92), transparent 66%),
    radial-gradient(34% 40% at 78% 10%, rgba(255,255,255,.32), transparent 70%),
    radial-gradient(44% 48% at 88% 80%, rgba(var(--bg2),.88), transparent 68%),
    radial-gradient(36% 40% at 26% 90%, rgba(255,255,255,.30), transparent 72%),
    radial-gradient(32% 36% at 54% 50%, rgba(var(--bg3),.70), transparent 70%);
  filter:blur(30px);
  animation:bgdrift 26s ease-in-out infinite alternate}
@keyframes bgdrift{
  0%  {transform:translate3d(-5%,3.5%,0) scale(1.02) rotate(-1.2deg)}
  50% {transform:translate3d(6%,-5%,0) scale(1.16) rotate(1.4deg)}
  100%{transform:translate3d(-4%,6%,0) scale(1.07) rotate(-0.6deg)}}
@media (prefers-reduced-motion: reduce){body::before{animation:none}}

/* ===== 접속 화면 (공유 코드 게이트) ===== */
.gate{position:fixed;inset:0;z-index:900;display:grid;place-items:center;
  background:rgba(238,242,246,.72);backdrop-filter:blur(9px) saturate(115%)}
.gate.hidden{display:none}
.gatecard{width:min(430px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 24px 64px rgba(31,44,61,.20),0 2px 6px rgba(31,44,61,.10);
  padding:34px 32px 26px;text-align:center}
.gatecard .glogo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px;
  font-size:14.5px;color:var(--ink);letter-spacing:-.2px}
.gatecard .glogo .mark{width:44px;height:22px;border-radius:8px;object-fit:cover;flex:none;
  box-shadow:0 1px 3px rgba(31,44,61,.14)}
.gatecard h2{margin:0 0 7px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.4px}
.gatecard .gsub{margin:0 0 20px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.gatecard .gsub b{color:var(--ink);font-weight:700}
.gatecard .gaterow{display:flex;gap:8px}
.gatecard .gaterow input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:11px;
  background:var(--plane2);padding:0 14px;font-size:17px;font-weight:700;letter-spacing:3px;
  text-align:center;text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--ink)}
.gatecard .gaterow input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.gatecard .gaterow input::placeholder{color:#c2cad4;font-weight:600;letter-spacing:3px}
.gatecard .gaterow .btn{height:44px;padding:0 20px;border-radius:11px;font-size:13.5px;font-weight:700;flex:none}
.gatecard .gatemsg{min-height:19px;margin-top:9px;font-size:12px;font-weight:600;color:var(--pace)}
.gatecard .gatemsg.ok{color:#3d6b52}
/* 접속 화면 전용 구분선 — 표의 그룹 구분선(td.gsep)과 이름이 겹치지 않도록 gatesep 로 */
.gatecard .gatesep{position:relative;margin:20px 0 14px;height:1px;background:var(--line)}
.gatecard .gatesep>span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  background:var(--surface);padding:0 11px;font-size:11px;color:var(--muted);font-weight:600}
.gatecard .btn.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:42px;border-radius:11px;font-size:13px;font-weight:700;margin-top:8px}
.gatecard .btn.ghost{background:var(--surface);color:var(--ink2)}
.gatecard .gfoot{margin-top:17px;font-size:11px;line-height:1.6;color:var(--muted)}
.gatecard .gfoot code{font-family:inherit;font-weight:800;color:var(--acc);letter-spacing:1.2px}
/* 공유 코드 (캠페인 관리) */
/* 샘플 둘러보기 중에는 캠페인 조작 버튼을 감추고 권한 요청 버튼만 남긴다 */
body[data-mode="sample"] #campSel,
body[data-mode="sample"] #campMng,
body[data-mode="sample"] #cloudSave{display:none !important}
.sharecode{display:inline-flex;align-items:center;gap:6px;font-weight:800;letter-spacing:1.6px;
  color:var(--acc);background:var(--acc-soft);border-radius:7px;padding:2px 9px;font-size:12px}
.sharecode.view{color:var(--acc2);background:#eaf0f1}
.codeline{display:flex;align-items:center;gap:7px;margin:2px 0}
.codeline .ck{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;min-width:42px;text-align:center}
.codeline .ck.staff{color:#2f4a63;background:#dde5ee}
.codeline .ck.view{color:#42625f;background:#dfeae8}
/* 계정 버튼 — 로그인한 구글 아이디를 보여 주고, 누르면 로그아웃 메뉴가 열린다 */
.mewrap{position:relative}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:3px 11px 3px 4px;cursor:pointer;max-width:250px}
.me:hover{border-color:var(--acc)}
.me .avatar{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;
  font-weight:800;display:grid;place-items:center;flex:none}
.me .mail{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:172px}
.me .cv{font-size:9px;color:var(--muted);flex:none}
.memenu{position:absolute;right:0;top:calc(100% + 7px);min-width:278px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);padding:6px;z-index:80}
.memenu.hidden{display:none}
.memenu .mi{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;
  padding:8px 11px;font-size:12.5px;color:var(--ink);cursor:pointer}
.memenu .mi:hover{background:var(--acc-soft)}
.memenu .mi.head{cursor:default;border-bottom:1px solid var(--line2);border-radius:0;margin-bottom:4px;
  padding-bottom:9px}
.memenu .mi.head b{display:block;font-size:13px}
.memenu .mi.head span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis}
/* 데이터가 없을 때 대시보드 자리에 보여 주는 안내 */
.emptybox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:46px 30px;text-align:center;margin:22px 0}
.emptybox.hidden{display:none}
.emptybox .ttl{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.emptybox .txt{margin-top:9px;font-size:13px;color:var(--ink2);line-height:1.7}
.emptybox .acts{margin-top:18px;display:flex;gap:8px;justify-content:center}
.nodata{display:none !important}
.copyb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:12px;cursor:pointer;padding:0;flex:none}
.copyb:hover{border-color:var(--acc);color:var(--acc)}
.copyb.ok{border-color:#3d6b52;color:#3d6b52}
/* 캠페인 관리 — 액션 버튼 두 줄, 글자는 세로 가운데 */
table.tbl td.acts{white-space:normal;padding:8px 10px}
table.tbl td.acts .ln{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
table.tbl td.acts .ln+.ln{margin-top:5px}
table.tbl td.acts .btn{display:inline-flex;align-items:center;justify-content:center;
  line-height:1;height:26px;padding:0 10px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.spacer{flex:1}

/* ---------- top ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 76px;height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.logo{cursor:pointer}
.logo:hover .mark{filter:brightness(1.06)}
.logo .mark{width:52px;height:26px;border-radius:9px;flex:none;display:block;object-fit:cover;
  box-shadow:0 1px 3px rgba(31,44,61,.14)}
/* 광고주 로고 — 높이는 26px 로 고정하고 가로만 비율대로(1:1 ~ 3:1) 늘린다 */
.logo .mark.adv{height:26px;width:auto;max-width:78px;min-width:26px;object-fit:contain;
  border-radius:6px;background:transparent;box-shadow:none}
.logo .brandtx{display:inline-flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap}
.logo .brandtx .adv{font-weight:800;font-size:14.5px;color:var(--ink);letter-spacing:-.2px}
.logo .brandtx .adv::after{content:'·';margin-left:7px;color:var(--line);font-weight:600}
.logo .brandtx .prod{font-weight:700;font-size:14px;color:var(--ink)}
.logo .brandtx .adv+.prod{font-weight:600;color:var(--ink2)}
.savedago{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.savedago.on::before{content:'●';color:#6f9b83;margin-right:4px;font-size:9px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink)}
.pill:hover{background:var(--acc-soft2)}
.role{display:flex;background:var(--plane);border-radius:9px;padding:3px;gap:2px}
.role button{border:0;background:transparent;padding:5px 13px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:600}
.role button.on{background:var(--surface);color:var(--acc);box-shadow:var(--shadow)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;
  font-weight:700;color:var(--acc);font-size:11px}
select.pill{appearance:none;-webkit-appearance:none;font-weight:700;padding-right:26px;max-width:340px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#signIn{gap:7px;font-weight:700}
#signIn svg{flex:none}
.demobar{display:flex;align-items:center;gap:10px;background:#fff6e8;border-bottom:1px solid #f0dfc4;
  color:#7a5a22;padding:8px 76px;font-size:12px}
.demobar>span{font-size:13px}
.demobar>div{flex:1}
.demobar .btn{height:24px;padding:0 9px;font-size:11px;border-color:#e4d3b8;background:#fffdf8}
.tabs{background:var(--surface);padding:0 76px;display:flex;gap:4px;position:sticky;top:56px;z-index:59}
@media (max-width:1500px){.topbar{padding:0 40px}.tabs{padding:0 40px}
  .subbar{padding:11px 40px}.demobar{padding:9px 40px}}
.tabs button{border:0;background:transparent;padding:12px 14px 10px;cursor:pointer;color:var(--ink2);
  font-weight:600;border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
/* 하위 탭 = 메인 탭 바로 아래 붙임 */
.tabs{border-bottom:1px solid var(--line)}
.subbar{background:var(--acc-soft);border-bottom:1px solid var(--line);padding:11px 76px;
  position:sticky;top:97px;z-index:58;display:flex;gap:6px}
.subbar button{border:1px solid transparent;background:transparent;padding:7px 18px;border-radius:9px;cursor:pointer;
  color:var(--ink2);font-weight:600;font-size:13px}
.subbar button:hover{background:rgba(255,255,255,.6)}
.subbar button.on{background:var(--surface);color:var(--acc);border-color:#d0d6de;box-shadow:var(--shadow)}
/* 리포트 내려받기 묶음은 하위 탭 줄의 맨 오른쪽으로 민다 */
.subbar .dlgrp{margin-left:auto}
.subbar .pill.dl{height:30px;font-weight:700}
/* 역할 표시 — 로그인 여부로 자동 결정 */
.rolechip{font-size:11.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.rolechip.agency{color:#38664f;background:#e9f1ec;border-color:#cfe0d6}

/* 영역 이름표 (캠페인 정보 · 필터) */
.barlbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 6px;text-transform:none}
.barlbl.first{margin-top:2px}
.barlbl.row{display:flex;align-items:center;gap:10px}
.barlbl.row .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.barlbl.row .tools .ctl{font-size:12px}

/* 일자별 상세 효율 — 가로/세로 세그먼트 구분선 */
table.tbl th.hsep,table.tbl td.hsep{border-left:3px solid var(--gline)}
table.tbl thead th.hsep{border-left-color:rgba(255,255,255,.72)}
table.tbl tr.total td.hsep{border-left-color:rgba(255,255,255,.72)}
.rawblock+.rawblock{margin-top:26px;padding-top:26px;border-top:3px solid var(--gline)}
.rawblock .subsec .hint{font-weight:500}
/* 하위 세그먼트 — 헤더를 연하게 해서 합계 블록과 한눈에 구분되게 */
table.tbl.sublv thead th{background:var(--hdr-sub)}
table.tbl.sublv thead th.g{background:var(--hdr-sub2)}
table.tbl thead th.subhd{background:var(--hdr-sub)}
table.tbl thead th.g.subhd{background:var(--hdr-sub2)}
/* 달성률 게이지 숨김 — 숫자만 남긴다 */
table.tbl.nogauge .gauge .track{display:none}
/* 헤더 편집 — 드래그로 그룹에 넣기 */
.gcard.dropok{outline:2px dashed var(--acc);outline-offset:2px;background:var(--acc-soft2)}
.cb[draggable=true]{cursor:grab}
.cb.dragging{opacity:.45}
.ghd .gmerge{height:22px;padding:0 7px;font-size:10.5px;border-radius:6px;flex:none}
.bkey .bhint{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
/* 효율 버블 차트 */
#bubbleWrap{position:relative;width:100%}
#bubble{position:relative;width:100%}
#bubble svg{display:block;width:100%;height:auto;border-radius:12px;background:#fff}
#bubble circle.bub{cursor:pointer;transition:fill-opacity .12s}
#bubble circle.bub:hover{fill-opacity:.95}
/* 버블 범례 — 그래프 위, 조금 크고 자세하게 */
.bublgd{border:1px solid var(--line);border-radius:12px;background:var(--acc-soft2);
  padding:12px 14px;margin:0 0 14px;font-size:12px;color:var(--ink2)}
.bublgd .lgtop{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start}
.bublgd .mgrp{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bublgd .bl{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;
  cursor:pointer;position:relative}
.bublgd .bl:hover{border-color:var(--acc)}
.bublgd .bl>i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.bublgd .bl .pen{font-size:10px;color:var(--muted);font-weight:600;margin-left:2px}
/* 매체 아래에 붙는 광고상품 색 — 모두 동그란 점 */
.bublgd .subs{display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  margin-left:13px;padding-left:12px;border-left:1px dashed var(--line)}
.bublgd .sb{display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:11.5px;font-weight:600;color:var(--ink2)}
.bublgd .sb>i{width:11px;height:11px;border-radius:50%;flex:none;display:block}
.bublgd .how{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:11px;padding-top:10px;
  border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink2);line-height:1.6}
.bublgd .how>span{flex:none;white-space:nowrap}
.bublgd .how b{color:var(--ink)}
/* 매체 색 고르기 */
.huepick{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow2);padding:9px;display:flex;gap:6px}
.huepick button{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.huepick button.on{border-color:var(--ink)}
.cnt2{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--acc);
  background:var(--acc-soft);border-radius:6px;padding:1px 7px;vertical-align:1px}

/* ---------- layout ---------- */
.wrap{padding:16px 76px 84px;max-width:1900px;margin:0 auto}
@media (max-width:1500px){.wrap{padding:16px 40px 84px}}
.sec{font-size:19px;font-weight:700;color:var(--sec);margin:28px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;letter-spacing:-.3px}
.sec.gap{margin-top:40px}
.sec.gap2{margin-top:56px}
.sec.gap3{margin-top:72px}
#summaryHost .sec:first-child{margin-top:72px}
.sec:first-child{margin-top:0}
/* 운영 코멘트 · 서머리 묶음은 페이지 중간에 오므로 첫 자식이라도 위 여백을 준다 */
#cmtBlock>.sec:first-child,#sumBlock>.sec:first-child{margin-top:72px}
.sec .note{font-size:12.5px;font-weight:500;color:var(--muted)}
.sec .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.subsec{font-size:15.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;margin:6px 0 9px}
.subsec .cnt{font-size:11.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px}
/* 섹션 제목 바로 아래 붙는 버튼 줄 */
.secbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters select,.filters input{height:32px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px}
.filters .lbl{color:var(--muted);font-size:12px}
.daterange{display:inline-flex;align-items:center;gap:5px;height:32px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);padding:0 5px 0 8px}
.daterange input[type=date]{height:26px!important;border:0!important;background:transparent!important;
  padding:0 2px!important;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.daterange .tilde{color:var(--muted);font-size:11px}
.daterange .btn{height:22px;padding:0 8px;font-size:11px;border-radius:6px}
.daterange .btn:disabled{opacity:.4;cursor:default}
.btn{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 13px;
  cursor:pointer;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{background:var(--acc-soft2);color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.bd{padding:16px 18px}
.grid{display:grid;gap:13px}
.hint{color:var(--muted);font-size:11.5px}
.ctl{height:29px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 7px;
  font-weight:600;color:var(--ink2);font-size:12px}
.sec .tools .ctl{font-size:12px}

/* 캠페인 요약 — 배경 없이 텍스트만 */
.cbar{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:2px 2px 14px;margin-bottom:2px;
  border-bottom:1px dashed var(--line)}
.cbar .it{display:flex;align-items:baseline;gap:7px}
.cbar .k{font-size:11px;color:var(--muted);font-weight:600}
.cbar .v{font-size:13px;font-weight:700;color:var(--ink2)}

/* ===== 캠페인 진행 현황 =====
   지표(노출 · 클릭 · 조회)마다 한 줄씩. 합산 수치는 쓰지 않는다.
   좌(지표명 · 집행) · 막대 · 우(목표)는 절대 줄바꿈하지 않고, 좁아지면 가로 스크롤. */
.pacescroll{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.pacebody{min-width:560px}
/* 맨 위 — 집행 경과 (가운데) */
.phead{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;margin-bottom:16px;display:flex;align-items:baseline;
  gap:9px;justify-content:center;white-space:nowrap}
.phead .sep{color:#cdd5de;font-weight:400}
.phead .el{font-size:13px;font-weight:700;color:var(--acc)}
.phead .vw{font-size:12px;font-weight:700;color:var(--muted);background:var(--acc-soft);
  border-radius:20px;padding:3px 10px;letter-spacing:0}
.tipbox .t .tsw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
  vertical-align:baseline}

.pline{display:flex;flex-wrap:nowrap;align-items:center;gap:16px}
.pline+.pline{margin-top:26px}
.pline.days{margin-bottom:26px;padding-bottom:18px;border-bottom:1px dashed var(--line)}
.pside{flex:0 0 132px;white-space:nowrap;text-align:right}
.pside.r{flex-basis:114px;text-align:left}
/* 지표 이름을 먼저 읽히게 — 이름은 크게 위, 수치는 작게 아래 */
/* 지표 줄은 막대 가운데에 글자를 맞춘다 — 위의 페이스 점 줄(13px)만큼 내려 준다.
   그러지 않으면 글자가 막대보다 위로 떠 보인다 */
.pline:not(.days) .pside{padding-top:13px}
.pside .nm1{font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.4px;line-height:22px}
.pside .sub1{font-size:12px;font-weight:600;color:var(--muted);line-height:17px;
  font-variant-numeric:tabular-nums}
/* 오른쪽은 달성률이 주인공 — 크게, 그 아래 목표 */
/* 달성률 숫자는 무채색으로 통일 — 색은 막대에서만 말한다 */
.pside.r .nm1{font-size:24px;font-weight:900;letter-spacing:-.9px;line-height:26px;
  color:var(--ink);font-variant-numeric:tabular-nums}
.pside.r .sub1{font-size:11.5px;font-weight:600;color:var(--muted);line-height:17px}
.pline.days .pside{padding-top:0}
.pline.days .pside .nm1,.pline.days .pside.r .nm1{font-size:11.5px;font-weight:600;
  color:var(--muted);line-height:16px;letter-spacing:0}
.pline.days .pside .sub1,.pline.days .pside.r .sub1{font-size:13.5px;font-weight:800;
  color:var(--ink2);line-height:19px}
.pmid{flex:1 1 auto;min-width:250px}

/* 지표별 달성 막대 — 매체는 색이 아니라 간격으로만 나눈다 */
/* 목표 페이스 점 — 막대 "위"가 아니라 막대 바로 위쪽 줄에 찍는다.
   색은 그 막대와 같은 색을 쓴다. */
.pdotrow{position:relative;height:13px}
.pdotrow>i{position:absolute;bottom:2px;width:9px;height:9px;border-radius:50%;
  transform:translateX(-50%);background:var(--dotc,#4c729a);display:block}
.pbar{position:relative;height:44px;border-radius:9px;background:var(--acc-soft);overflow:hidden}
/* 마우스를 올리면 막대 전체가 지금 페이스를 나타내는 색으로 바뀐다 */
.pbar .mstack>i{transition:background-color .18s}
.pbar.hot .mstack>i{background-image:none !important;background-color:var(--hotc,#4c729a)}
.pbar .mstack{position:absolute;left:0;top:0;bottom:0;display:flex;gap:3px}
/* 구간 채움 = 색 물결(위) + 남색 바탕(아래) 두 겹.
   물결을 배경으로 넣었기 때문에 매체 이름 글자보다 뒤에 있고, 구간 사이 간격(구분선)도 침범하지 않는다.
   --ambt(0~1, #paceBox 에서 한 번에 움직인다) 로 모든 지표가 같은 위상으로 흐른다. */
.pbar .mstack>i{min-width:0;overflow:hidden;
  background-image:linear-gradient(100deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 8%,
      var(--ambc,rgba(0,0,0,0)) 34%,var(--ambc,rgba(0,0,0,0)) 66%,
      rgba(0,0,0,0) 92%,rgba(0,0,0,0) 100%),
    linear-gradient(var(--ambflat,rgba(0,0,0,0)),var(--ambflat,rgba(0,0,0,0))),
    var(--segbg);
  background-repeat:no-repeat,no-repeat,no-repeat;
  background-size:var(--wavew,0px) 100%,100% 100%,auto;
  background-position:calc(var(--ambt,.5) * (var(--barw,0px) + var(--wavew,0px))
    - var(--wavew,0px) - var(--segoff,0px)) 0, 0 0, 0 0;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 9px}
.pbar .mstack>i:first-child{border-radius:9px 0 0 9px}
.pbar .mstack>i:last-child{border-radius:0 9px 9px 0}
.pbar .mstack>i:only-child{border-radius:9px}
/* 매체 글자 — 있는 줄만 알 정도로 옅게 */
.pbar .mstack .nm{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.66);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;line-height:1.2}
.pbar .mstack .pc{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.46);
  white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.pbar .mstack i.nolb .nm,.pbar .mstack i.nolb .pc{display:none}
.pbar .mstack i.nopc .pc{display:none}
/* 채워진 구간 위를 은은하게 흐르는 광택 */
.pbar .sheen{position:absolute;left:0;top:0;bottom:0;pointer-events:none;border-radius:9px;
  background:linear-gradient(104deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.13) 26%,
    rgba(255,255,255,0) 50%,rgba(255,255,255,.11) 76%,rgba(255,255,255,0) 100%);
  background-size:260% 100%;animation:pacedrift 22s ease-in-out infinite alternate;z-index:3}
@keyframes pacedrift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.pbar .sheen{animation:none}}

/* 집행 일자 게이지 — 다른 막대와 같은 남색 계열 */
.dgauge{display:flex;gap:2px;width:100%}
.dgauge i{flex:1 1 0;min-width:0;height:14px;border-radius:3px;background:var(--acc-soft);display:block}
.dgauge i.on{background:linear-gradient(160deg,var(--b3),var(--b4))}
.dgauge i.on.rest{background:linear-gradient(160deg,var(--b2),var(--b3))}
.dgauge i.rest{background:var(--acc-soft2)}

.pfoot{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:12px;
  border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink2);font-weight:600;
  flex-wrap:wrap}
.pfoot>i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;
  background:#4c729a}
.pfoot span{color:var(--muted);font-weight:500}
.delta{font-weight:700}.delta.up{color:var(--acc)}.delta.down{color:var(--neg)}

/* ===== 리포트 내려받기 (엑셀 · PDF) ===== */
.dlgrp{display:inline-flex;align-items:center;gap:6px}
.dlgrp .lb{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.pill.dl{display:inline-flex;align-items:center;gap:5px;padding:0 10px}
.pill.dl svg{width:14px;height:14px;flex:none;display:block}
.pill.dl[disabled]{opacity:.55;cursor:default}
@media (max-width:1180px){.dlgrp .lb{display:none}.pill.dl span{display:none}.pill.dl{padding:0 9px}}

/* ===== 인쇄(PDF 저장) =====
   화면을 그대로 인쇄하지 않고, JS 가 만들어 둔 인쇄 전용 문서(#printdoc)만 찍는다.
   영역마다 원래 폭을 픽셀로 고정하고 zoom 으로 줄여 두기 때문에 종이 위에서 배치가 흐트러지지 않는다. */
#printdoc{display:none}
#printdoc.measuring{display:block;position:absolute;left:0;top:0;z-index:-1;
  visibility:hidden;pointer-events:none}
/* 표의 고정(sticky) 칸은 인쇄본에서 전부 풀어 준다 —
   스크롤 상자가 없어지면 sticky 칸이 오른쪽 끝으로 밀려 붙어 표가 어긋난다 */
#printdoc table th,#printdoc table td{position:static !important;left:auto !important;
  top:auto !important;z-index:auto !important}
#printdoc .ghfix,#printdoc .hnav,#printdoc .cfmenu{display:none !important}
#printdoc .cmtprint{font-size:12px;line-height:1.6;color:var(--ink2)}
#printdoc .pbk{margin:0 0 16px}
#printdoc .pbki{transform-origin:top left}
#printdoc .phdr{margin:0 0 16px;padding:0 0 10px;border-bottom:1px solid var(--line)}
#printdoc .phdr .t{font-size:17px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
#printdoc .phdr .s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
@media print{
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff !important;width:auto !important;margin:0 !important;padding:0 !important}
  body::before,body::after{display:none !important}
  body>*{display:none !important}
  body>#printdoc{display:block !important}
  #printdoc .card{box-shadow:none !important;border-color:#dde3ea !important}
  #printdoc .sec{break-after:avoid;margin-top:0}
  #printdoc .stat .spark{display:none !important}   /* 인쇄에서 글자와 겹친다 */
  #printdoc .duo{break-inside:avoid}
  a[href]::after{content:'' !important}
}

/* ===== 열 너비 드래그 ===== */
th.cresz{position:relative}
.colgrip{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.colgrip::after{content:'';position:absolute;left:2px;top:18%;bottom:18%;width:2px;border-radius:1px;
  background:transparent;transition:background .12s}
.colgrip:hover::after{background:rgba(255,255,255,.55)}
body.colresizing,body.colresizing *{cursor:col-resize !important;user-select:none !important}

/* ===== 영역 설명 (ⓘ) ===== */
.cmt h4 .mper{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:7px;letter-spacing:0}
.infowrap{position:relative;display:inline-flex}
.infoi{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--muted);font-size:11.5px;font-weight:800;cursor:help;display:inline-flex;
  align-items:center;justify-content:center;line-height:1;padding:0;transition:.12s;
  font-family:inherit}
.infoi:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft2)}
/* 화면(뷰포트) 기준으로 띄운다 — 자리는 열 때 JS 가 잡는다.
   화면 밖으로 나가거나 카드에 잘리지 않고, 아래가 좁으면 위로 열린다 */
.infopop{position:fixed;left:0;top:0;width:340px;max-width:min(340px,92vw);
  background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow2);
  padding:13px 15px;z-index:120;font-size:12px;font-weight:400;color:var(--ink2);
  line-height:1.6;letter-spacing:0;text-align:left;white-space:normal}
.infopop::before{content:'';position:absolute;right:var(--arrx,5px);top:-6px;width:11px;height:11px;
  background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);
  transform:rotate(45deg)}
/* 위로 열릴 때는 화살표도 아래를 향한다 */
.infowrap.up .infopop::before{top:auto;bottom:-6px;
  border-left:0;border-top:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.infopop b{color:var(--ink);font-weight:700}
.infopop .h{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:5px}
.infopop p{margin:0 0 7px}
.infopop p:last-child{margin-bottom:0}
.infowrap:not(.open) .infopop{display:none}

/* donut */
/* KPI 카드 — 줄바꿈 없이 가로로 스크롤한다 (매체가 늘어도 한 줄) */
.donuts{display:flex!important;gap:14px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;
  scroll-snap-type:x proximity}
.donuts>.donut{flex:0 0 312px;scroll-snap-align:start}
.donut{padding:12px 13px 14px;text-align:center;position:relative}
.donut .ring{overflow:visible}
.donut .nm{font-weight:700;font-size:14px}
/* 제목은 좌측 상단, 부제목(KPI)은 그 오른쪽 */
.donut .dhd{display:flex;align-items:center;gap:9px;text-align:left}
.donut .dhd .k{color:var(--ink2);font-size:13.5px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.donut .kpitag{margin-left:auto;flex:none;display:inline-block;font-size:10.5px;
  font-weight:700;padding:2px 8px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
.donut .ring{margin:6px auto 4px;position:relative;width:264px;height:264px}
.donut .ring svg{overflow:visible}
.donut .ctr{pointer-events:none}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;gap:0}
.donut .ctr b{font-size:25px;font-weight:700;letter-spacing:-.6px;line-height:1}
.donut .ctr .l2{font-size:17px;font-weight:700;line-height:1.15}
.donut .ctr span{font-size:9.5px;color:var(--muted);line-height:1.2;white-space:nowrap}
/* 가운데 — 달성률만 */
.donut .ctr .ctrbox{max-width:104px;margin:0 auto;display:grid;gap:1px;justify-items:center}
.donut .ctr .achk{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.donut .ctr .achv{font-size:26px;font-weight:800;letter-spacing:-1.4px;line-height:1.1;color:var(--ink)}
/* 도넛 카드 왼쪽 아래 범례 — 목표 페이스 값까지 함께 */
/* 글자는 회색, 색은 앞의 점에만 — 붉은 글씨가 너무 튀었다 */
.donut .dlgd{display:flex;flex-direction:column;gap:2px;align-items:flex-start;
  margin:2px 2px 0;font-size:11px;font-weight:600;color:var(--muted);text-align:left}
.donut .dlgd b{color:var(--ink2)}
.donut .dlgd .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.donut .dlgd .sw{width:9px;height:9px;border-radius:3px;background:var(--pace);flex:none}
.donut .dlgd .pcpar{margin-left:2px;font-variant-numeric:tabular-nums;font-weight:700}
.donut .dlgd .lg.spend{color:var(--acc)}
.donut .dlgd .lg.spend .sw{background:var(--acc)}
.donut.spend{background:linear-gradient(180deg,#f7f9fb,#fff)}
.donut .kwrap{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:7px}
.donut .kline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink2)}
.donut .kline .kn{display:flex;align-items:center;gap:6px;font-weight:700}
.donut .kline .kv b{color:var(--ink)}
.donut .kline .kv span{color:var(--muted)}

/* stat tiles — 정사각형에 가까운 카드 + 배경 일별 추이 */
/* 주요 지표 — 좁아져도 카드를 찌그러뜨리지 않고 가로 스크롤로 넘긴다 */
.strip{display:flex;gap:13px;overflow-x:auto;overflow-y:hidden;
  padding:5px 4px 10px;scroll-snap-type:x proximity}
.strip>.stat{flex:1 0 244px;min-width:244px;scroll-snap-align:start}
.stat{position:relative;overflow:hidden;padding:0;aspect-ratio:1/.94;min-height:250px}
.stat .sbody{position:relative;z-index:2;padding:18px 20px 0}
.stat .k{color:var(--ink2);font-size:13.5px;font-weight:700}
.stat .v{font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:2px;line-height:1.15;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v.lng{font-size:25px;letter-spacing:-1.2px}
.stat .v.lng2{font-size:21px;letter-spacing:-1.2px}
.stat .dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;margin-top:4px;
  padding:1px 7px;border-radius:999px;white-space:nowrap}
.stat .dl i{font-style:normal;font-size:11px}
.stat .dl.up{color:#2f6b4c;background:#e8f2ec}
.stat .dl.down{color:#a34d43;background:#f8eceb}
.stat .dl.na{color:var(--muted)}
.stat .e{font-size:11.5px;color:var(--ink2);margin-top:12px}
.stat .r{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat .r2{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat .r b,.stat .r2 b{color:var(--acc)}
/* 목표 페이스 · 일평균은 강조하지 않는다 */
.stat .r .sub,.stat .r2 .sub{color:var(--muted);font-weight:400}
/* 배경 추이 — 좌우 여백·축·범례 없이 카드 아래쪽에 깔린다 */
.stat .spark{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;pointer-events:none}
.stat svg.spk{display:block;width:100%;height:100%}
.stat .spk-now{pointer-events:none}
.stat .sppill{position:absolute;z-index:3;pointer-events:none;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow2);padding:5px 10px;
  text-align:center;white-space:nowrap;line-height:1.25}
.stat .sppill .d{display:block;font-size:10px;color:var(--muted);font-weight:600}
.stat .sppill b{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .sppill[hidden]{display:none}
@media(max-width:1200px){.stat{aspect-ratio:auto;min-height:200px}}

/* treemap */
/* 노출 분포 · 효율 버블 — 한 행 안에 좌우로, 카드 높이는 항상 같게 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:stretch;margin-top:72px}
.duo>.duocol>.sec{margin-top:0}
.duo>.duocol{min-width:0;display:flex;flex-direction:column}
.duo>.duocol>.sec{align-items:flex-end}
.duo>.duocol>.card{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.duo>.duocol>.card>.bd{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.duo .sec .tools{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:1440px){.duo{grid-template-columns:1fr;gap:0}
  .duo>.duocol>.card{min-height:560px}
  /* 두 칸이 위아래로 놓이면 아래 칸 제목 위에 다른 섹션과 같은 여백을 준다 */
  .duo>.duocol+.duocol>.sec{margin-top:72px}}
/* 흰 영역 안에서 그래프가 남은 높이를 채운다 */
.duo #treemap{flex:1 1 auto;min-height:0;display:flex}
.duo .tmap{flex:1 1 auto;height:auto;min-height:340px}
.duo #bubbleWrap{flex:1 1 auto;min-height:0;display:flex}
.duo #bubble{flex:1 1 auto;min-height:0;display:flex}
.duo #bubble svg{width:100%;height:100%;min-height:0}
.duo .bublgd{padding:10px 12px;margin:0 0 10px;flex:none}
.duo .bublgd .how{gap:5px 16px;margin-top:9px;padding-top:8px;font-size:11px}
.tmap{position:relative;width:100%;height:520px;border-radius:10px;overflow:hidden;
  background:var(--plane2);border:1px solid var(--line2)}
/* 섹터(매체) — 굵은 테두리를 border-box 로 그려 어느 쪽이든 같은 두께 */
.tmap .sect{position:absolute;overflow:hidden;border:4px solid var(--surface);border-radius:3px}
/* 매체 머리글 — 아래 그룹 상자(.grp)가 2px 흰 테두리를 갖고 있으므로
   상품 머리글(.gh)이 칠해지는 자리와 똑같이 좌우를 2px 씩 들여 놓는다.
   (예전에는 투명 테두리 + background-clip:padding-box 로 맞췄는데,
    색을 style="background:…" 로 넣는 순간 단축 속성이 background-clip 을 되돌려
    매체 띠만 좌우로 2px 씩 더 넓게 칠해졌다 — 여러 번 지적받은 그 문제다) */
.tmap .sect>.sh{position:absolute;left:2px;right:2px;top:0;height:21px;
  display:flex;align-items:center;
  gap:6px;padding:0 8px;font-size:11.5px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;z-index:3}
.tmap .sect>.sh .sv{margin-left:auto;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.tmap .sin{position:absolute;left:0;right:0;top:0;bottom:0}
.tmap .grp{position:absolute;border:2px solid rgba(255,255,255,.92);border-radius:2px;
  pointer-events:none;z-index:2}
.tmap .grp>.gh{position:absolute;left:0;right:0;top:0;height:17px;line-height:17px;padding:0 6px;
  font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#fff;text-shadow:0 1px 1px rgba(20,30,42,.28)}
.tmap .tile{position:absolute;overflow:hidden;border:1px solid rgba(255,255,255,.55);
  display:flex;flex-direction:column;justify-content:center;padding:4px 6px;cursor:default;
  transition:filter .1s}
.tmap .tile:hover{filter:brightness(1.14)}
.tmap .tile .tn{font-size:11px;font-weight:700;line-height:1.2;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 1.5px rgba(20,30,42,.30)}
.tmap .tile .tv{font-size:10.5px;opacity:.92;text-shadow:0 1px 1.5px rgba(20,30,42,.26);font-variant-numeric:tabular-nums;margin-top:1px}
.tmap .tile.sm .tv{display:none}
.tmap .tile.xs .tn{font-size:9.5px}
.tmap .tile.tiny .tn,.tmap .tile.tiny .tv{display:none}
.tmap-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12.5px}


/* 일자별 상세 효율 — 가로 세그먼트가 많으면 일자 · 요일 두 열을 왼쪽에 고정 */
.tbl-wrap.hfrozen table.tbl thead tr:first-child th:first-child,
.tbl-wrap.hfrozen table.tbl thead tr.total td.head{position:sticky;left:0;z-index:6}
.tbl-wrap.hfrozen table.tbl tbody td.head:nth-child(1){position:sticky;left:0;z-index:3}
.tbl-wrap.hfrozen table.tbl tbody td.head:nth-child(2){position:sticky;z-index:3}
.tbl-wrap.hfrozen table.tbl tbody tr td.head:nth-child(2){left:var(--fz1,72px)}
/* 고정된 두 열의 오른쪽에 경계선 하나 */
.tbl-wrap.hfrozen table.tbl tbody td.head:nth-child(2),
.tbl-wrap.hfrozen table.tbl thead tr:first-child th:first-child,
.tbl-wrap.hfrozen table.tbl thead tr.total td.head{border-right:2px solid var(--gline)}

/* 일자별 상세 효율 — 가로 세그먼트 미니맵 */
.hnav{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.hnav.idle{display:none}
.hnav .nvb{width:26px;height:26px;flex:none;border:1px solid var(--line);background:#fff;border-radius:7px;
  color:var(--ink2);font-size:11px;font-weight:800;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;justify-content:center}
.hnav .nvb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.hnav .nvb:disabled{opacity:.32;cursor:default}
.hnav .nvmap{flex:1;min-width:0}
.hnav .nvchips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.hnav .nvchips::-webkit-scrollbar{display:none}
.hnav .nvc{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;
  font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.hnav .nvc:hover{border-color:var(--acc);color:var(--acc)}
.hnav .nvc.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hnav .nvbar{position:relative;height:4px;border-radius:3px;background:#e4e9ef;margin-top:5px}
.hnav .nvbar>i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--acc-lt);display:block}

/* 효율 우수 소재 — 기준 선택 칩 */
.rankpick{display:inline-flex;gap:4px;flex-wrap:wrap}
.rankpick button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
.rankpick button:hover{border-color:var(--acc);color:var(--acc)}
.rankpick button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.crband{margin:0 0 8px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.crband .t{font-size:14px;font-weight:700;color:var(--ink)}
.crband .n{font-size:11.5px;color:var(--muted)}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;align-items:center}
.legend .it{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.linekey{width:18px;height:3px;border-radius:3px;background:#2f5d6b;display:inline-block}
#tip{position:fixed;z-index:600;pointer-events:none;opacity:0;transition:opacity .08s;
  background:rgba(31,44,61,.95);color:#fff;border-radius:10px;padding:9px 11px;font-size:11.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.22);min-width:160px;max-width:320px}
#tip .t{font-weight:700;margin-bottom:6px;opacity:.9}
#tip .r{display:flex;gap:8px;justify-content:space-between;margin-top:3px}
#tip .r .l{display:flex;align-items:center;gap:6px;opacity:.92}
#tip .r b{font-variant-numeric:tabular-nums}

/* 표 폭 맞춤 — 값이 적으면 내용 너비만큼만 (왼쪽 정렬) */
.card.fit{width:max-content;max-width:100%}
table.tbl.fit{width:auto}

/* 섹션 숨기기 */
.sec .hidebtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:8px;height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer}
.sec .hidebtn:hover{border-color:var(--acc);color:var(--acc)}
.hiddenbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;padding:9px 12px;
  background:var(--acc-soft2);border:1px dashed var(--gline);border-radius:10px;font-size:12px;color:var(--ink2)}
.hiddenbar b{font-weight:700;color:var(--ink)}
.hiddenbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600;cursor:pointer}
.hiddenbar button:hover{border-color:var(--acc);color:var(--acc)}
.hiddenbar .allbtn{margin-left:auto;font-weight:700;color:var(--acc)}

/* 운영 코멘트 */
.cmtbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-bottom:9px;margin-bottom:11px;
  border-bottom:1px solid var(--line2)}
.cmtbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);height:27px;
  min-width:29px;padding:0 8px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
.cmtbar button:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft2)}
.cmtbar .sep{width:1px;height:17px;background:var(--line);margin:0 4px}
.cmtbar .sw{display:inline-flex;gap:3px;align-items:center}
.cmtbar .cbox{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0;min-width:0}
.cmt{min-height:150px;outline:none;font-size:13px;line-height:1.75;color:var(--ink);
  padding:4px 2px;word-break:break-word}
.cmt:focus{outline:none}
.cmt:empty::before{content:'운영 코멘트를 입력하세요. ‘자동 작성’을 누르면 지금 조회 기간 기준으로 초안을 만들어 드립니다.';
  color:var(--muted)}
.cmt h4{font-size:13.5px;font-weight:800;color:var(--hol);margin:16px 0 6px}
.cmt h4:first-child{margin-top:0}
.cmt b{font-weight:700}
.cmt ul{margin:4px 0 4px 2px;padding-left:18px}
.cmt li{margin:1px 0}
.cmt li::marker{color:var(--muted)}
.cmt h4.main{color:var(--acc-d)}
.cmt h5{font-size:13px;font-weight:800;color:var(--ink);margin:10px 0 3px}
/* 보조줄 — 윗줄보다 한 글자 들여 쓰고 앞에 ㄴ 를 붙인다 */
.cmt .sub{color:var(--acc);display:block;padding-left:2.1em;text-indent:-1.1em}
.cmt .sub::before{content:'ㄴ ';color:var(--muted);font-weight:700}
.cmtbar .grp{display:inline-flex;align-items:center;gap:4px}
.cmtbar .glbl{font-size:11px;font-weight:700;color:var(--muted);margin-right:1px}
.cmtbar button.hl{color:#2f6fb0;border-color:#c3d8ec;font-weight:800}
.cmtbar button.hl:hover{background:#eaf2fa;color:#2f6fb0;border-color:#2f6fb0}
.cmt .cmtsum{background:var(--acc-soft2);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:9px;padding:10px 13px;margin:0 0 14px}
.cmt .cmtsum .t{font-weight:800;color:var(--acc);display:block;margin-bottom:5px}
.cmt .cmtsum .ln{display:block;margin:2px 0;padding-left:11px;text-indent:-11px}
.cmt .cmtsum .ln::before{content:'· ';color:var(--muted)}
.cmt[contenteditable="false"]{color:var(--ink2)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:74vh}
/* 세로 스크롤 없이 전체 높이 그대로 (가로 스크롤만) — 효율 탭 서머리 */
.tbl-wrap.noy{max-height:none;overflow-y:visible}
/* 세로 스크롤이 없으면 헤더 고정도 불필요 — 고정 때문에 생기던 행 높이 단차도 사라진다 */
.tbl-wrap.noy table.tbl th{position:static}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl th,table.tbl td{padding:9px 10px;border-bottom:1px solid var(--cell);text-align:center;
  font-size:12.5px;line-height:1.4;vertical-align:middle;font-family:inherit}
/* 모든 세로 구분선은 같은 색 · 같은 굵기 */
table.tbl th,table.tbl td{border-right:1px solid var(--cell)}
table.tbl th:last-child,table.tbl td:last-child{border-right:0}
/* 모든 표의 본문 칸은 흰색으로 채운다 — 뒤 배경이 비쳐 칸마다 색이 달라 보이지 않도록.
   아래의 행 헤더 · 빈 칸 · 소계 · 합계 규칙이 이 값을 덮어쓴다.
   목표(예상) 열도 일반 값과 똑같이: 데이터 행은 흰색, 소계 행은 그 소계 단계 색 */
table.tbl tbody td{background:var(--surface)}
table.tbl th{background:var(--hdr);color:#fff;font-weight:700;position:sticky;top:0;z-index:2}
table.tbl thead th,table.tbl tr.total td{border-color:var(--cell-d)}
table.tbl th.g{background:var(--hdr2);z-index:3}
table.tbl thead tr:nth-child(2) th{top:33px}
table.tbl td.gsep,table.tbl th.gsep{border-left:1px solid var(--cell)}
table.tbl thead th.gsep,table.tbl tr.total td.gsep{border-left-color:var(--cell-d)}
table.tbl td.head{background:var(--surface);font-weight:600;color:var(--ink)}
/* 값이 아예 없는 칸 — 옅은 회색 바탕으로 "해당 없음"을 분명히 */
/* 값이 없는 칸도 배경은 그 행의 색 그대로 — 열마다 배경이 달라 보이지 않게 한다(함정 2).
   비어 있다는 신호는 옅은 – 하나로 충분하다 */
table.tbl td.blank .na{color:#b6bfca}
table.tbl tr.sub td.blank .na{color:#8e9aa8}
table.tbl tr.total td.blank .na{color:rgba(255,255,255,.5)}
table.tbl tbody tr:hover td{background:var(--acc-soft2)}
table.tbl tbody tr:hover td.head{background:var(--acc-soft)}
/* 합계 행은 헤더 첫 행과 배경색을 구분한다 */
table.tbl tr.total td,table.tbl tbody tr.total:hover td{background:var(--tot) !important;color:#fff;font-weight:800}
table.tbl tr.sub td,table.tbl tbody tr.sub:hover td{background:#e9ecf0 !important;font-weight:700;color:var(--acc-d)}
/* 소계가 여러 단계면 단계마다 배경을 조금씩 다르게 (1단계가 가장 진함) */
table.tbl tr.sub.sub-l0 td,table.tbl tbody tr.sub.sub-l0:hover td{background:#ccd6e2 !important;color:#26313d}
table.tbl tr.sub.sub-l1 td,table.tbl tbody tr.sub.sub-l1:hover td{background:#e0e7ef !important}
table.tbl tr.sub.sub-l2 td,table.tbl tbody tr.sub.sub-l2:hover td{background:#edf1f6 !important}
table.tbl tr.sub.sub-l3 td,table.tbl tbody tr.sub.sub-l3:hover td{background:#f5f8fb !important}
/* 소계가 연달아 나오면 위 칸과 붙어 보이므로 단계가 바뀌는 지점에 선을 하나 넣는다 */
table.tbl tr.sub.sub-l0>td{border-top:2px solid #a9b8c8}
table.tbl tr.drag td{cursor:grab}
table.tbl tr.dragging td{opacity:.4}
table.tbl tr.ins-top td{box-shadow:inset 0 2px 0 var(--acc)}
table.tbl tr.ins-bot td{box-shadow:inset 0 -2px 0 var(--acc)}
/* 상위 계층 셀(매체·광고상품…) 블록 이동 */
table.tbl td.bdrag{cursor:grab}
table.tbl td.bdragging{opacity:.45}
table.tbl td.ins-top{box-shadow:inset 0 3px 0 var(--acc)}
table.tbl td.ins-bot{box-shadow:inset 0 -3px 0 var(--acc)}
/* 게런티(보장) 값 — 소계 · 합계 행에서는 그 행 글자색을 따라간다 (배경과 겹쳐 안 보이지 않도록) */
table.tbl td .gt{color:var(--acc);font-weight:800}
table.tbl tr.sub td .gt{color:var(--acc-d)}
table.tbl tr.sub.sub-l0 td .gt{color:#1d2733}
table.tbl tr.total td .gt,table.tbl thead tr.total td .gt{color:#fff}
table.tbl td.hol,table.tbl td.hol *{color:var(--hol) !important}
table.tbl th.g input.ghdr{width:100%;min-width:60px;height:22px;border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:12.5px;text-align:center;
  border-radius:5px;padding:0 5px;outline:none}
table.tbl.lite th.g input.ghdr{border-color:var(--acc);background:#fff;color:var(--acc-d)}
table.tbl td.gt{color:var(--acc);font-weight:800}
table.tbl td.hl{color:var(--acc);font-weight:800}
.gauge{display:inline-flex;flex-direction:column;align-items:center;gap:5px;min-width:64px;font-size:inherit}
.gauge .track{width:58px;height:5px;border-radius:3px;background:#dee4ec;overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:3px;background:var(--acc)}
tr.total .gauge .track{background:rgba(255,255,255,.3)}
tr.total .gauge .track i{background:#fff}
.na{color:#ccd3dc}
/* 밝은 헤더 변형 — 라인별 설정 · 데이터 입력 · 팝업 표 */
table.tbl.lite th{background:var(--acc-soft2);color:var(--ink2)}
table.tbl.lite thead th,table.tbl.lite tr.total td,
table.tbl.lite thead th.gsep,table.tbl.lite tr.total td.gsep{border-color:var(--cell)}
table.tbl.lite th.g{background:var(--acc-soft);color:var(--acc)}
table.tbl.lite tr.total td,table.tbl.lite tbody tr.total:hover td{background:#e0e4e9 !important;color:var(--acc-d)}
table.tbl input,table.tbl select{height:29px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  padding:0 7px;text-align:center;width:100%;min-width:70px;font-size:12px}
table.tbl input.num{text-align:right}
table.tbl input.txt{text-align:left}
.gchk{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--muted);font-weight:600;margin-left:0}
/* 보장 여부 체크박스 — 체크박스 위에 작게 "보장" */
.gchk.gwarr{flex-direction:column;gap:0;line-height:1}
.gchk.gwarr .gl{font-size:8.5px;letter-spacing:-.4px;color:var(--muted);margin-bottom:1px}
td.expcell.gt .gchk.gwarr .gl{color:var(--acc)}
.gchk input{width:11px;height:11px;margin:0;accent-color:var(--acc)}
/* 게런티 체크박스는 아주 작게 · 좌우 여백 최소 */
td.expcell{padding-left:3px;padding-right:3px}
td.expcell .gwrap{display:flex;align-items:center;gap:2px}
td.expcell .gchk input{width:12px;height:12px;flex:none}   /* 게런티 체크박스 — 이전 9px의 1.3배 */
#tblKpi .gchk input{width:12px;height:12px}
/* 예상효율 표 — 선택된 셀 */
#tblKpi td.lsel{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-soft)}
#tblKpi td.lsel input,#tblKpi td.lsel select,#tblKpi td.lsel textarea{background:#fff}
/* 예상효율 표 — 열 폭을 좁게, 값은 모두 가운데 정렬 */
#tblKpi th,#tblKpi td{padding-left:5px;padding-right:5px}
#tblKpi input,#tblKpi select{min-width:0;padding:0 4px}
#tblKpi input.num,#tblKpi input.txt,#tblKpi input[type=date],#tblKpi input[type=time]{text-align:center}
#tblKpi td.mono,#tblKpi td{text-align:center}
#tblKpi .chipfield{padding:3px 22px 3px 4px;justify-content:center}
#tblKpi textarea.note{text-align:left}
/* 열 설정 모달의 선택박스 — 아주 작게 */
.colcfg-chk{width:13px!important;height:13px!important;min-width:0!important;margin:0;padding:0;
  accent-color:var(--acc);flex:none;border-radius:3px;cursor:pointer}
label.colcfg-lab{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:3px 2px}
td.gt input.num{color:var(--acc);font-weight:800}
/* 칩 입력 필드 — 소재 · 타겟팅 그룹 (한 칸에 여러 개) */
.chipfield{position:relative;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-start;
  min-height:29px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 26px 4px 5px;text-align:left}
.chipfield:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px rgba(73,94,114,.15)}
.chipfield .cfchip{display:inline-flex;align-items:center;gap:4px;background:var(--acc-soft);color:var(--acc-d);
  border:1px solid #cfd8e2;border-radius:6px;padding:2px 5px 2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.chipfield .cfchip b{cursor:pointer;color:#94a2b1;font-weight:700;font-size:10px}
.chipfield .cfchip b:hover{color:var(--neg)}
.chipfield .cfchip b.ed{font-size:10.5px}
.chipfield .cfchip b.ed:hover{color:var(--acc)}
.chipfield .cfpick{border:1px dashed var(--gline);background:var(--surface);color:var(--muted);
  border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chipfield .cfpick:hover{border-color:var(--acc);color:var(--acc);border-style:solid;background:var(--acc-soft2)}
.chipfield .cfadd{position:absolute;right:3px;top:3px;border:0;background:var(--acc-soft);color:var(--acc);
  width:19px;height:19px;border-radius:5px;cursor:pointer;font-size:12px;line-height:1;padding:0}
.chipfield .cfadd:hover{background:var(--acc);color:#fff}
/* body에 fixed로 띄워 표 스크롤 영역에 잘리지 않게 */
.cfmenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow2);padding:5px;min-width:200px;max-height:240px;overflow:auto;text-align:left}
.cfmenu .mi{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:6px;
  font-size:11.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.cfmenu .mi:hover{background:var(--acc-soft);color:var(--acc)}
.cfmenu .mt{font-size:10.5px;color:var(--muted);font-weight:700;padding:4px 8px}
textarea.note{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  font-size:12px;resize:vertical;line-height:1.4;background:var(--surface);text-align:left}
.lite .gchk{color:var(--muted)}

/* builder */
.builder{background:var(--acc-soft2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.brow{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.brow+.brow{border-top:1px dashed var(--line)}
.bkey{width:92px;flex:none;color:var(--ink2);font-weight:700;font-size:12px;padding-top:6px}
.zone{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-height:38px;border:1.5px dashed #c7cfda;border-radius:10px;
  padding:6px;background:var(--surface)}
.zone.over{border-color:var(--acc);background:var(--acc-soft)}
.zone .ph{color:var(--muted);font-size:11.5px;padding:5px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid #d7dee7;background:var(--surface);
  color:var(--ink2);border-radius:8px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-weight:600;user-select:none}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.dragging{opacity:.35}
.chip .ord{background:rgba(255,255,255,.3);border-radius:4px;padding:0 5px;font-size:10px}
.chip .x{opacity:.7;font-size:10px}
.chip label{display:flex;align-items:center;gap:4px;font-size:10.5px;background:rgba(255,255,255,.22);
  border-radius:5px;padding:1px 5px;cursor:pointer}
.chip.ins-l::before,.chip.ins-r::after{content:'';position:absolute;top:-2px;bottom:-2px;width:3px;
  background:var(--acc);border-radius:2px}
.chip.ins-l::before{left:-5px}.chip.ins-r::after{right:-5px}
.pool{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pool.col{flex-direction:column;gap:8px;min-width:0}
/* 값 열 목록 — 분류 탭 한 줄 + 항목 칩 (작은 화면에서도 두세 줄로 끝나도록) */
.cattabs{display:flex;flex-wrap:wrap;gap:4px}
.cattabs .ctab{border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.5}
.cattabs .ctab:hover{border-color:var(--acc);color:var(--acc)}
.cattabs .ctab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.catitems{display:flex;flex-wrap:wrap;gap:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px;max-height:132px;overflow-y:auto}
.catitems .cb{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:7px;
  background:var(--plane2);padding:3px 9px;cursor:grab;white-space:nowrap;line-height:1.6}
.catitems .cb:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.catitems .cb.used{color:#b8c4d3;background:transparent;border-style:dashed;cursor:default}
.catitems .ph{color:var(--muted);font-size:11.5px;padding:3px}
.groups{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.gcard{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:190px;box-shadow:var(--shadow)}
.gcard.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(73,94,114,.20)}
.gcard .ghd{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line2);
  background:var(--acc-soft2);border-radius:10px 10px 0 0;cursor:grab}
.gcard .ghd .ghandle{color:#9ba6b4;cursor:grab;flex:none;user-select:none}
.gcard .ghd input{border:1px solid transparent;background:var(--surface);font-weight:700;font-size:11.5px;
  color:var(--acc-d);width:100%;outline:none;border-radius:6px;padding:3px 6px;cursor:text}
.gcard .ghd input:hover{border-color:var(--line);background:var(--acc-soft2)}
.gcard .ghd input:focus{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 2px rgba(73,94,114,.16)}
.gcard .gbd{display:flex;flex-wrap:wrap;gap:5px;padding:8px;min-height:44px}
.gcard.ins-l::before,.gcard.ins-r::after{content:'';position:absolute;top:0;bottom:0;width:3px;background:var(--acc);border-radius:2px}
.gcard.ins-l::before{left:-6px}.gcard.ins-r::after{right:-6px}
.bfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:11px;border-top:1px dashed var(--line);margin-top:4px}

/* creatives — 기준(조회 · 클릭 · 노출)마다 한 칸, 세 칸이 좌우로 나란히.
   칸 안에서는 1위를 왼쪽에 크게, 2위부터는 오른쪽에 한 줄로 작게 (영역 높이를 낮춘다) */
.crcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 30px;align-items:start}
@media(max-width:1400px){.crcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.crcols{grid-template-columns:1fr}}
.crduo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.78fr);gap:12px;align-items:stretch}
.crrest{display:grid;gap:9px;min-width:0}
.cr{overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.cr:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.cr .thumb{position:relative;aspect-ratio:1/1;overflow:hidden;display:grid;place-items:center;background:#e9edf2}
.cr .thumb .fill{position:absolute;inset:0;background-size:cover;background-position:center}
.cr .thumb .ytprev{position:absolute;left:50%;top:50%;width:178%;height:178%;
  transform:translate(-50%,-50%);border:0;pointer-events:none;z-index:1}
.cr .thumb.playable::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34px;height:34px;border-radius:50%;background:rgba(31,44,61,.42);color:#fff;font-size:12px;
  display:grid;place-items:center;z-index:2;transition:opacity .15s}
.cr .thumb.playable:hover::after{opacity:0}
.cr .media{position:absolute;top:8px;left:8px;background:rgba(31,44,61,.62);border-radius:7px;
  padding:2px 8px;font-size:10.5px;font-weight:700;color:#fff;z-index:3}
.cr .rankno{position:absolute;top:8px;right:8px;width:21px;height:21px;border-radius:50%;
  background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;z-index:3}
/* 1위 리본 — 카드 왼쪽 위 모서리를 사선으로 가로지른다 */
.cr .ribbon{position:absolute;left:0;top:0;width:78px;height:78px;overflow:hidden;z-index:5;
  pointer-events:none}
.cr .ribbon>i{position:absolute;left:-26px;top:15px;width:120px;height:23px;line-height:23px;
  transform:rotate(-45deg);text-align:center;font-style:normal;
  font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;
  background:linear-gradient(100deg,#cfa94f,#a8802c);
  box-shadow:0 2px 7px rgba(20,30,44,.3)}
/* 1위 카드는 매체 칩을 오른쪽으로 보내 리본과 겹치지 않게 한다 */
.cr.lead .thumb .media{left:auto;right:8px}
.cr .rt{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.9);border-radius:7px;
  padding:2px 7px;font-size:10px;font-weight:700;color:var(--ink2);z-index:3}
.cr .meta{padding:9px 11px 11px;border-top:1px solid var(--line2);min-width:0}
.cr .meta .nm{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .meta .eff{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px;
  font-size:11.5px;color:var(--muted)}
.cr .meta .eff b{color:var(--acc);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
/* 2위 이하 — 가로형 미니 카드 */
.cr.mini{display:flex;align-items:stretch;min-height:0}
/* 빈 슬롯 — 소재가 모자라도 카드 크기가 흔들리지 않게 자리를 잡아 둔다 */
/* 빈 슬롯 — 자리만 잡고 아무것도 그리지 않는다 (색·테두리·글자 없음) */
.cr.mini.empty{background:transparent;border:0;box-shadow:none;cursor:default;pointer-events:none}
.cr.mini .thumb{flex:none;height:100%;aspect-ratio:1/1;border-radius:0}
.cr.mini .thumb .rankno{width:17px;height:17px;font-size:9.5px;top:5px;right:5px}
.cr.mini .thumb.playable::after{width:22px;height:22px;font-size:9px}
.cr.mini .meta{flex:1;min-width:0;border-top:0;border-left:1px solid var(--line2);
  padding:7px 10px;display:flex;flex-direction:column;justify-content:center}
.cr.mini .meta .nm{font-size:11.5px}
.cr.mini .meta .mm{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.cr.mini .meta .eff{margin-top:3px;font-size:10.5px}
.cr.mini .meta .eff b{font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(23,33,46,.62);backdrop-filter:blur(3px);z-index:500;
  display:grid;place-items:center;padding:34px}
.modal .box{background:var(--surface);border-radius:16px;overflow:hidden;width:100%;
  box-shadow:0 24px 70px rgba(0,0,0,.3);max-height:88vh;display:flex;flex-direction:column}
.modal .mhd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mhd b{font-size:14.5px}
.modal .mbd{padding:16px 18px;overflow:auto;background:var(--plane2)}
.modal .mft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.modal .x{border:0;background:var(--plane);width:30px;height:30px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.modal iframe{border:0;width:100%;aspect-ratio:16/9;border-radius:10px;max-width:840px}
.lbft{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;text-align:center;width:100%}
.lbft div{font-size:12px;color:var(--muted)}
.lbft b{color:var(--ink);display:block;font-size:14px;font-variant-numeric:tabular-nums}
/* 소재 팝업 — 원본 + 표시 항목 선택 + 링크 수정 */
.lbwrap{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:20px;align-items:start}
@media(max-width:900px){.lbwrap{grid-template-columns:1fr}}
.lbmedia{display:grid;place-items:center;min-height:330px;background:var(--plane2);border-radius:12px;padding:14px}
.lbmedia iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;box-shadow:var(--shadow2)}
.lbph{color:var(--muted);font-size:12.5px;border:1.5px dashed var(--gline);border-radius:10px;
  padding:60px 24px;text-align:center;width:100%}
.lbside{font-size:12px}
.lbsec{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.lbstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.lbst{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11.5px;
  border-bottom:1px dashed var(--line);padding-bottom:4px}
.lbst b{color:var(--ink)}
.lbpick{display:flex;flex-wrap:wrap;gap:6px}
.lbpick label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.lbpick input{width:12px;height:12px;margin:0;accent-color:var(--acc)}
.lblink label{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-bottom:4px}
.lblink input{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
  background:var(--surface);font-size:12px}
.lblink input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(73,94,114,.15)}

/* gantt */
/* 게재 히스토리 — 세로 스크롤 없이 전체 높이를 그대로 보여 준다 (소재 비교가 중요).
   overflow-y:clip 은 스크롤 컨테이너를 만들지 않으므로 헤더가 페이지 기준으로 고정된다. */
.gantt-wrap{overflow-x:auto;overflow-y:clip;max-height:none}
table.gantt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%;table-layout:auto}
table.gantt th,table.gantt td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  font-size:11.5px;text-align:center;padding:0}
table.gantt th{background:var(--hdr);color:#fff;font-weight:700;z-index:5;height:26px}
/* 세로 스크롤이 없으므로 헤더는 아래의 떠 있는 머리글 막대(.ghfix)로 고정한다 */
.ghfix{position:fixed;z-index:57;overflow:hidden;display:none;box-shadow:0 4px 10px rgba(31,44,61,.13)}
.ghfix.on{display:block}
.ghfix .inner{overflow:hidden}
.ghfix table.gantt{margin:0}
table.gantt th.mo{background:var(--hdr2)}
table.gantt th.gsep,table.gantt td.gsep{border-left:1px solid var(--gline)}
table.gantt th.lead,table.gantt td.lead{position:sticky;z-index:6;background:var(--surface);padding:7px 9px;
  border-right:1px solid var(--gline);width:1%}
table.gantt th.mcol,table.gantt td.mcol{width:1%}
table.gantt th.lead{background:var(--hdr);z-index:7}
table.gantt td.lead.nm{text-align:left}
table.gantt td.hl{color:var(--acc);font-weight:800}
table.gantt td.day{min-width:13px;height:34px;vertical-align:middle;padding:3px 1px}
table.gantt td.day .b{display:block;width:100%;height:100%;border-radius:2px}
table.gantt td.day.we{background:#f6f8fb}
table.gantt td.day.hol{background:#f0f2f5}
table.gantt tbody tr:hover td.lead{background:var(--acc-soft2)}
/* 행·열 하이라이트 (데이터 읽기 보조) */
table.gantt tbody tr.rowhi td{background:var(--acc-soft2)}
table.gantt tbody tr.rowhi td.lead{background:var(--acc-soft)}
table.gantt td.day.colhi{background:#e2e7ed}
table.gantt tbody tr.rowhi td.day.colhi{background:#d4dbe3}
table.gantt th.dhd{cursor:default}
table.gantt th.dhd.colhi{background:var(--acc);color:#fff!important}
table.gantt td.day{cursor:crosshair}
table.gantt tr.dragging td{opacity:.4}
table.gantt tr.ins-top td{box-shadow:inset 0 2px 0 var(--acc)}
table.gantt tr.ins-bot td{box-shadow:inset 0 -2px 0 var(--acc)}
table.gantt td.bdrag{cursor:grab}
table.gantt td.bdragging{opacity:.45}
table.gantt td.ins-top{box-shadow:inset 0 3px 0 var(--acc)}
table.gantt td.ins-bot{box-shadow:inset 0 -3px 0 var(--acc)}
/* 간트 색 범례 — 히트맵과 같은 초록(우수) → 회색 → 붉은색(저조) */
.shlegend{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:600}
.shlegend i.ramp{width:76px;height:9px;display:inline-block;border-radius:2px;
  background:linear-gradient(90deg,rgb(177,201,188),rgb(206,210,215),rgb(210,188,188))}
.shlegend em{font-style:normal}
.shlegend .ar{opacity:.55}


/* KPI 달성 현황 카드 — 끌어서 좌우 순서 바꾸기 */
.donut[draggable]{cursor:grab}
.donut.dragging{opacity:.45;cursor:grabbing}
.donut.dropL{box-shadow:inset 3px 0 0 var(--acc)}
.donut.dropR{box-shadow:inset -3px 0 0 var(--acc)}
/* 표 위쪽에 붙는 가로 스크롤바 — 표가 길 때 아래까지 내려가지 않아도 좌우로 옮길 수 있다 */
.topscroll{overflow-x:auto;overflow-y:hidden;height:12px;margin:0 0 4px;
  border-radius:8px;background:var(--plane2)}
.topscroll>i{display:block;height:1px}
.topscroll::-webkit-scrollbar{height:10px}
.topscroll::-webkit-scrollbar-thumb{background:var(--gline);border-radius:8px}
.topscroll::-webkit-scrollbar-track{background:transparent}
/* 디자인 — 테마 고르기 */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:11px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.thcard:hover{border-color:var(--acc-lt);background:var(--acc-soft2)}
.thcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.thcard .sws{display:flex;gap:4px}
.thcard .sws i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.06)}
.thcard .thl{font-size:12.5px;font-weight:700;color:var(--ink)}
/* 광고주 로고 고르기 */
.logopick{display:flex;align-items:center;gap:10px}
.logopick .prev{display:inline-flex;align-items:center;justify-content:center;height:34px;min-width:60px;
  max-width:120px;padding:0 8px;border:1px dashed var(--line);border-radius:9px;background:var(--plane2)}
.logopick .prev img{height:26px;width:auto;max-width:104px;object-fit:contain;display:block}
.logopick .prev em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
/* 요일별 · 일자별 효율 히트맵 */
.hmramp{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:600}
.hmramp i{width:84px;height:9px;display:inline-block;border-radius:2px;
  background:linear-gradient(90deg,#a9c8b8,#dbdfe4,#d6c2bf)}
.hmramp em{font-style:normal}
/* 세로 스크롤 없이 전부 보여 준다 — 머리글은 떠 있는 복사본(#heatHead)으로 고정 */
.heatwrap{max-height:none;overflow-y:visible}
table.tbl.heat{border-spacing:0;table-layout:fixed;width:100%}
table.tbl.heat th,table.tbl.heat td{border-right:0;border-bottom:0}
/* 머리글 3단 — 구분·매체는 진한 남색, 광고상품은 한 톤 연하게, KPI 는 가장 약하게 */
table.tbl.heat th{padding:7px 9px;line-height:1.3;border-bottom:2px solid #fff;
  border-right:2px solid #fff;position:static;white-space:normal;word-break:keep-all}
table.tbl.heat thead th:last-child{border-right:0}
table.tbl.heat th.lead{background:var(--hdr);color:#fff;font-size:12.5px;font-weight:700;
  border-bottom:0;vertical-align:middle}
table.tbl.heat th.h1{background:var(--hdr);color:#fff;font-size:12.5px;font-weight:700}
table.tbl.heat th.h2{background:#6d7b8a;color:#fff;font-size:11.5px;font-weight:600}
table.tbl.heat th.h3{background:#eef1f5;color:var(--sec);font-size:10.5px;font-weight:700;
  letter-spacing:.01em;white-space:nowrap}
table.tbl.heat td{padding:0;background:transparent !important}
/* 구분 열 — 가운데 정렬 · 남색 글씨 */
table.tbl.heat td.head{padding:0 10px;background:#fbfcfe !important;font-weight:700;
  color:var(--acc-d);text-align:center;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.tbl.heat tbody tr:hover td.head{background:var(--acc-soft) !important}
table.tbl.heat td.head.hol{color:var(--hol)}
/* 값 칸 — 선 대신 여백으로 나눈 칩 */
table.tbl.heat td.hm{cursor:default}
table.tbl.heat td.hm .c{display:block;margin:2px;border-radius:6px;padding:6px 8px;
  font-size:12px;font-weight:600;color:#243040;background:#f2f4f7;
  font-variant-numeric:tabular-nums;text-align:center;transition:filter .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tbl.heat td.hm .c.na{color:#c2c9d2;background:#f6f7f9;font-weight:500}
table.tbl.heat td.hm:hover .c{filter:brightness(.94)}
/* 카테고리 구분 줄 */
table.tbl.heat tr.hcat td{background:#e6ebf1 !important;color:#26313d;font-weight:800;
  text-align:left;letter-spacing:.02em;padding:7px 12px;font-size:12px}
table.tbl.heat tr.hcat+tr td{padding-top:1px}
/* 왼쪽 구분 열은 가로 스크롤에서도 붙어 있게 */
table.tbl.heat td.head,table.tbl.heat tr.hcat td{position:sticky;left:0;z-index:3}
table.tbl.heat th.lead{position:sticky;left:0;z-index:6}
.crthumb-sm{width:34px;height:26px;border-radius:5px;display:inline-block;vertical-align:middle;
  background-size:cover;background-position:center;box-shadow:0 0 0 1px var(--line)}

/* sheet */
.sheet-wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-variant-numeric:tabular-nums}
table.sheet th{position:sticky;top:0;z-index:3;background:var(--acc-soft2);color:var(--ink2);font-weight:700;
  font-size:11px;padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);text-align:center}
table.sheet td{padding:0;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);position:relative}
table.sheet td input{width:100%;height:32px;border:0;background:transparent;padding:0 8px;text-align:center;
  outline:none;font-size:12.5px}
table.sheet td.sel{background:var(--acc-soft)}
table.sheet td.anchor input{box-shadow:inset 0 0 0 2px var(--acc);background:#fff}
/* 드롭다운 셀 — 누르면 바로 목록이 열리는 select */
table.sheet td.dd select{width:100%;height:32px;border:0;background:transparent;padding:0 16px 0 8px;
  text-align:center;text-align-last:center;outline:none;font-size:12.5px;cursor:pointer;
  color:var(--ink);appearance:none;-webkit-appearance:none}
table.sheet td.dd select:focus{box-shadow:inset 0 0 0 2px var(--acc);background:#fff}
table.sheet td.dd select option[value=""]{color:var(--muted)}
table.sheet td.dd::after{content:'▾';position:absolute;right:6px;top:50%;transform:translateY(-50%);
  color:var(--acc);font-size:10px;pointer-events:none;opacity:.75}
/* 일자 셀 — 텍스트 자유 입력 + 우측 달력 아이콘 */
table.sheet td.dt .datecell{display:flex;align-items:center;position:relative}
table.sheet td.dt input.dtxt{padding-right:22px;cursor:text}
table.sheet td.dt button.dpick{position:absolute;right:3px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--acc);opacity:.65;cursor:pointer;
  line-height:0;padding:2px;border-radius:4px;display:flex;align-items:center}
table.sheet td.dt button.dpick:hover{opacity:1;background:var(--acc-soft)}
table.sheet td.dt input.dnative{position:absolute;right:4px;bottom:0;width:1px;height:1px;opacity:0;
  border:0;padding:0;pointer-events:none}
table.sheet tr.bad td{background:#fbeeed}
table.sheet tr.bad td input,table.sheet tr.bad td select{color:#b5564e;font-weight:700}
table.sheet td.rm button{border:0;background:transparent;color:var(--muted);cursor:pointer;height:32px;width:100%}
table.sheet td.rm button:hover{color:var(--neg)}
table.sheet td.calc{background:var(--acc-soft2);color:var(--ink2);text-align:center;height:32px;line-height:32px}

/* forms */
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld label{display:block;color:var(--muted);font-size:11.5px;margin-bottom:5px;font-weight:600}
.fld input,.fld select{width:100%;height:35px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 11px}
.fld .ro{background:var(--acc-soft2);border:1px solid #dbe1e9;font-weight:700;display:flex;align-items:center;
  height:35px;border-radius:9px;padding:0 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fld .ro.ell{display:block;line-height:33px;overflow:hidden;text-overflow:ellipsis}
.locked{background:#f1f3f6 !important;color:#93a0b0 !important}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--acc-soft);border:1px solid #d9e7fa;
  color:#1c5386;border-radius:11px;padding:11px 13px;font-size:12px}
.tagchip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink2);background:var(--plane2)}
.tagchip.on{background:var(--acc-soft);border-color:#d0d6de;color:var(--acc);font-weight:700}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--ink2);font-weight:600}
.switch i{width:34px;height:19px;border-radius:99px;background:#cfd8e3;position:relative;transition:.15s}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--acc)}
.switch.on i::after{left:17px}
.mock{position:fixed;right:16px;bottom:16px;background:rgba(31,44,61,.85);color:#fff;border-radius:999px;
  padding:7px 15px;font-size:11.5px;z-index:120;box-shadow:var(--shadow2)}
@media print{.topbar,.tabs,.subbar,.filters,.mock,.btn,.ctl{display:none!important}.wrap{padding:0}body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
